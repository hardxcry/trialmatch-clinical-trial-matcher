[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "trialmatch"
version = "1.0.0"
description = "Hybrid retrieval and eligibility screening for clinical trial matching"
requires-python = ">=3.10"
dependencies = [
  "numpy", "requests", "rank-bm25", "sentence-transformers", "torch",
  "matplotlib", "streamlit", "plotly", "pandas",
]

[project.optional-dependencies]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
